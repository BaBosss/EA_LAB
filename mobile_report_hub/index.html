<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Read-only EA_LAB research report hub" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>EA_LAB Report Hub</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to reports</a>
    <header class="site-header">
      <p class="eyebrow">READ-ONLY RESEARCH VIEW</p>
      <h1>EA_LAB REPORT HUB</h1>
      <p id="project-meta" class="muted" aria-live="polite">Loading report index…</p>
      <div id="data-warning" class="data-warning" role="status" hidden></div>
    </header>

    <main id="main-content" class="shell" tabindex="-1">
      <nav class="top-nav" aria-label="Report hub sections">
        <a href="#home" data-nav="home">Home</a>
        <a href="#queue" data-nav="queue">Queue</a>
        <a href="#compare" data-nav="compare">Compare</a>
      </nav>
      <section id="app" aria-live="polite"></section>
    </main>

    <template id="loading-template"><p class="empty-state">Loading report index…</p></template>
    <noscript><p class="empty-state">This report hub needs JavaScript to render the report index.</p></noscript>
    <script src="app.js" defer></script>
  </body>
</html>
