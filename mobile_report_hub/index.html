<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d18" />
    <meta name="description" content="Read-only EA_LAB monitoring and research home" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>EA_LAB Monitor</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to monitoring</a>
    <header class="site-header">
      <div class="brand-row">
        <div>
          <p class="eyebrow">CONTROL TOWER</p>
          <h1>EA_LAB CONTROL TOWER</h1>
        </div>
        <span class="readonly-pill" aria-label="Read-only presentation">READ ONLY</span>
      </div>
      <div class="status-strip" aria-live="polite">
        <div><span class="meta-label">Global state</span><strong id="global-state" class="state-token state-unknown">UNKNOWN</strong></div>
        <div><span class="meta-label">Last updated</span><strong id="last-updated">UNKNOWN</strong></div>
      </div>
      <p id="project-meta" class="project-meta">Loading report index...</p>
      <div id="data-warning" class="data-warning" role="status" hidden></div>
    </header>

    <main id="main-content" class="shell" tabindex="-1">
      <section id="app" aria-live="polite">
        <p class="empty-state">Loading monitoring home...</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Monitor sections">
      <a href="#home" data-nav="home"><span aria-hidden="true">⌂</span><span>Overview</span></a>
      <a href="#work" data-nav="work"><span aria-hidden="true">≡</span><span>Work</span></a>
      <a href="#runtime" data-nav="runtime"><span aria-hidden="true">◉</span><span>Runtime</span></a>
      <a href="#ealab" data-nav="ealab"><span aria-hidden="true">◇</span><span>EA Lab</span></a>
      <a href="#alerts" data-nav="alerts"><span aria-hidden="true">!</span><span>Alerts</span></a>
    </nav>

    <noscript><p class="empty-state noscript">This monitor needs JavaScript to render the report index.</p></noscript>
    <script src="app.js" defer></script>
  </body>
</html>
