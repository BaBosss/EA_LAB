validation_mode: "MODE_A_FULL_ROBUSTNESS"
upstream_verdict: "PASS (holdout 2023-24 cleared: PF 1.34 on a window never used for selection)"

audit_trail:
  chain_id: "EA_RSI_MR_GRIDLOG_20260707_01"
  parent_skill: "backtest-optimize-rigor (holdout gate)"

data_source:
  computed_by_script: true
  script_output_files:
    - "_mt5_auto/RSIMR_MC.json"
    - "_mt5_auto/RSIMR_trades.csv (578 trades, full-span 2020-2026 EURUSD H1 ATR9)"

monte_carlo:
  pf_5th: 1.342          # bootstrap 5th — GREEN (>1.2)
  dd_95th_pct: 4.65      # GREEN (< observed MaxDD 3.1 + 5)
  prob_of_ruin_pct: 0.0  # GREEN (<2%)
  pf_range_5_95: 0.779   # YELLOW (0.5-1.0)
  bootstrap_used: true
  score: 85              # GREEN-dominant (1 YELLOW)

wfa:
  status: "COMPUTED"          # 3 rolling windows, each IS-optimize ATR{8,9,10} -> OOS test
  data_source: "_mt5_auto/RSIMR_WFA.csv"
  efficiency_ratio: 1.25      # GREEN — mean(OOS PF / IS PF); OOS actually BEATS IS (W1 0.90/W2 1.20/W3 1.66)
  oos_profitable_pct: 100.0   # GREEN — 3/3 OOS windows PF>1 (1.31 / 1.74 / 2.52)
  score: 95
  verdict_cap_applied: false
  caveat: "ER>1 partly because OOS slices include the favorable recent regime; per-window IS edge is
           modest (PF 1.13-1.52). Robust by the rubric, but rides on the recent regime staying kind."

oos:
  status: "COMPUTED"
  data_source: "date-split 0.7 of full-span + TRUE holdout 2023-24 (separate run)"
  oos_pf: 1.541
  pf_degradation_pct: 9.9     # GREEN (<15%)
  score: 85

score:
  formula_used: "MC*0.40 + WFA*0.40 + OOS*0.20 (all tests computed)"
  mode_a_robustness_score: 89
  band: "ROBUST (>=75, no cap)"

verdict:
  result: "ROBUST"
  reason: "All three tests computed and GREEN-dominant: MC ruin 0% / PF-5th 1.34; WFA ER 1.25 (OOS beats
           IS), 3/3 OOS windows profitable; OOS degradation 9.9%. Score 89, no hard override triggered
           (DD95th 4.65 == 1.5xMaxDD exactly, not exceeded). HONEST caveat kept: the edge is
           CAPPED-RECOVERY not signal (flat-lot loses in trend years) and modest per-window (IS PF
           1.1-1.5); ROBUST by the rubric but rides on the recent regime staying favorable -> DEMO-first
           is still the prudent path despite the ROBUST label."
  skipped_tests: []
  forwardable: true

deploy_guidance:
  demo_first: true         # ROBUST by rubric, but modest recovery-driven edge -> prove on demo before live
  rationale: "capped-recovery harvester, modest edge (per-window PF 1.1-1.5), EURUSD-only, ~100 trd/yr;
              ROBUST score rides partly on the kind recent regime"
  suggested: "join the demo cohort now (magic 990103, EURUSD H1, set RSIMR_ATRf_9); if it holds live
              behaviour ~3mo alongside the others, THEN consider small live per live-deployment-controller"

handoff:
  next_skill: "live-deployment-controller — demo-first, then live if the demo period confirms"
